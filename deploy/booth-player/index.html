<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hone booth loop</title>
<style>
  :root {
    --bg: #000;
    --ink: #f4f4f6;
    --ink-2: #b8bac4;
    --panel: rgb(16 17 24 / 0.86);
    --line: rgb(255 255 255 / 0.16);
    --accent: oklch(0.62 0.15 277);
    --accent-2: oklch(0.74 0.12 277);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--ink);
    font: 14px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body.idle { cursor: none; }
  video { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; background: var(--bg); }

  .controls { position: fixed; left: 0; right: 0; bottom: 0; padding: 48px 20px 16px;
    background: linear-gradient(to top, rgb(0 0 0 / 0.78), rgb(0 0 0 / 0)); transition: opacity .25s; }
  body.idle .controls, body.idle .chapters { opacity: 0; pointer-events: none; }

  .bar { position: relative; height: 22px; cursor: pointer; touch-action: none; }
  .track { position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: var(--line); }
  .buffered, .played { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }
  .buffered { background: rgb(255 255 255 / 0.22); }
  .played { background: var(--accent); }
  .bar:hover .track { top: 8px; height: 6px; }
  .tick { position: absolute; top: 5px; width: 2px; height: 12px; margin-left: -1px; background: rgb(255 255 255 / 0.55); border-radius: 1px; }
  .knob { position: absolute; top: 5px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--ink); }
  .tip { position: absolute; bottom: 26px; transform: translateX(-50%); padding: 4px 8px; border-radius: 6px;
    background: var(--panel); white-space: nowrap; font-size: 12.5px; pointer-events: none; display: none; }
  .bar:hover .tip { display: block; }

  .row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  button { appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; cursor: pointer;
    height: 34px; min-width: 34px; padding: 0 8px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  button:hover { background: rgb(255 255 255 / 0.1); }
  button:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 1px; }
  button svg { width: 20px; height: 20px; fill: currentColor; }
  .time { font-variant-numeric: tabular-nums; color: var(--ink-2); margin: 0 6px; }
  .now { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .spacer { flex: 1; }

  .chapters { position: fixed; right: 16px; bottom: 92px; width: min(360px, calc(100vw - 32px)); max-height: 60vh; overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; transition: opacity .25s; }
  .chapters[hidden] { display: none; }
  .chapters h2 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 6px 10px 4px; }
  .chapters button { width: 100%; height: auto; justify-content: flex-start; padding: 8px 10px; text-align: left; gap: 10px; }
  .chapters button.on { background: color-mix(in oklch, var(--accent) 30%, transparent); }
  .chapters .at { font-variant-numeric: tabular-nums; color: var(--ink-2); width: 44px; flex: none; }
  .chapters .sub { display: block; color: var(--ink-2); font-size: 12.5px; }
  .hint { color: var(--ink-2); font-size: 12px; margin: 6px 10px 4px; }
</style>
</head>
<body>
<video id="v" autoplay muted loop playsinline preload="auto" disablepictureinpicture></video>

<div class="chapters" id="chapters" hidden>
  <h2>Chapters</h2>
  <div id="list"></div>
  <p class="hint">Space pauses. Arrows skip 10 seconds. Page up and page down jump between chapters. F is full screen.</p>
</div>

<div class="controls" id="controls">
  <div class="bar" id="bar" role="slider" aria-label="Seek" tabindex="0">
    <div class="track"><div class="buffered" id="buffered"></div><div class="played" id="played"></div></div>
    <div id="ticks"></div>
    <div class="knob" id="knob"></div>
    <div class="tip" id="tip"></div>
  </div>
  <div class="row">
    <button id="play" title="Play or pause (space)" aria-label="Play or pause"></button>
    <button id="back" title="Back 10 seconds (left arrow)" aria-label="Back 10 seconds">
      <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg></button>
    <button id="fwd" title="Forward 10 seconds (right arrow)" aria-label="Forward 10 seconds">
      <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg></button>
    <span class="time" id="time">0:00 / 0:00</span>
    <span class="now" id="now"></span>
    <span class="spacer"></span>
    <button id="toc" title="Chapters (C)" aria-label="Chapters">
      <svg viewBox="0 0 24 24"><path d="M3 5h2v2H3zm4 0h14v2H7zM3 11h2v2H3zm4 0h14v2H7zm-4 6h2v2H3zm4 0h14v2H7z"/></svg></button>
    <button id="mute" title="Sound on or off (M)" aria-label="Sound on or off"></button>
    <button id="full" title="Full screen (F)" aria-label="Full screen">
      <svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>
  </div>
</div>

<script>
// At /loop behind the booth login the video comes from /booth-video, next to a rendered loop it is hone-loop.mp4.
// ?src= overrides both. The chapter list sits next to the video as <name>.chapters.json.
const params = new URLSearchParams(location.search);
const src = params.get('src') || (location.pathname.startsWith('/loop') ? '/booth-video/loop.mp4' : 'hone-loop.mp4');
const $ = (id) => document.getElementById(id);
const v = $('v');
v.src = src;
v.muted = true;

const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
  muted: '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9zm12.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>',
  sound: '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9zm11.5 3A4.5 4.5 0 0 0 13 8v8a4.5 4.5 0 0 0 2.5-4zM13 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>',
};

const fmt = (s) => {
  if (!isFinite(s)) return '0:00';
  s = Math.max(0, Math.floor(s));
  const m = Math.floor(s / 60), r = String(s % 60).padStart(2, '0');
  return m >= 60 ? `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}:${r}` : `${m}:${r}`;
};

let chapters = [];
const chapterAt = (t) => { let i = 0; chapters.forEach((c, k) => { if (c.start <= t + 0.05) i = k; }); return i; };

function renderChapters() {
  const list = $('list'), ticks = $('ticks');
  list.innerHTML = ''; ticks.innerHTML = '';
  chapters.forEach((c, i) => {
    const b = document.createElement('button');
    b.innerHTML = `<span class="at">${fmt(c.start)}</span><span>${escapeHtml(c.title)}${c.sub ? `<span class="sub">${escapeHtml(c.sub)}</span>` : ''}</span>`;
    b.addEventListener('click', () => seek(c.start));
    list.appendChild(b);
    if (i > 0 && v.duration) {
      const t = document.createElement('div');
      t.className = 'tick';
      t.style.left = `${(c.start / v.duration) * 100}%`;
      ticks.appendChild(t);
    }
  });
}
const escapeHtml = (s) => s.replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

fetch(src.replace(/\.mp4(\?.*)?$/, '.chapters.json'))
  .then((r) => (r.ok ? r.json() : []))
  .then((list) => { chapters = Array.isArray(list) ? list : []; renderChapters(); update(); })
  .catch(() => {});

function update() {
  const d = v.duration || 0, t = v.currentTime;
  const pct = d ? (t / d) * 100 : 0;
  $('played').style.width = `${pct}%`;
  $('knob').style.left = `${pct}%`;
  if (v.buffered.length && d) $('buffered').style.width = `${(v.buffered.end(v.buffered.length - 1) / d) * 100}%`;
  $('time').textContent = `${fmt(t)} / ${fmt(d)}`;
  $('play').innerHTML = v.paused ? ICON.play : ICON.pause;
  $('mute').innerHTML = v.muted ? ICON.muted : ICON.sound;
  if (chapters.length) {
    const i = chapterAt(t);
    $('now').textContent = chapters[i].title;
    [...$('list').children].forEach((b, k) => b.classList.toggle('on', k === i));
  }
}
['timeupdate', 'play', 'pause', 'progress', 'volumechange', 'seeked'].forEach((e) => v.addEventListener(e, update));
v.addEventListener('loadedmetadata', () => { renderChapters(); update(); });

const seek = (t) => { v.currentTime = Math.min(Math.max(0, t), (v.duration || 1) - 0.1); update(); poke(); };
const toggle = () => (v.paused ? v.play().catch(() => {}) : v.pause());
const jumpChapter = (dir) => {
  if (!chapters.length) return seek(v.currentTime + dir * 60);
  const i = chapterAt(v.currentTime);
  // Back goes to the start of the current chapter first, unless it is already there.
  const target = dir < 0 && v.currentTime - chapters[i].start > 3 ? i : i + dir;
  seek(chapters[(target + chapters.length) % chapters.length].start);
};
const fullscreen = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});

$('play').addEventListener('click', toggle);
$('back').addEventListener('click', () => seek(v.currentTime - 10));
$('fwd').addEventListener('click', () => seek(v.currentTime + 10));
$('mute').addEventListener('click', () => { v.muted = !v.muted; });
$('full').addEventListener('click', fullscreen);
$('toc').addEventListener('click', () => { $('chapters').hidden = !$('chapters').hidden; poke(); });
v.addEventListener('click', toggle);
v.addEventListener('dblclick', fullscreen);

// Seek bar: click or drag, and a tooltip with the time and chapter under the pointer.
const bar = $('bar');
const timeAt = (x) => { const r = bar.getBoundingClientRect(); return Math.min(1, Math.max(0, (x - r.left) / r.width)) * (v.duration || 0); };
let dragging = false;
bar.addEventListener('pointerdown', (e) => { dragging = true; bar.setPointerCapture(e.pointerId); seek(timeAt(e.clientX)); });
bar.addEventListener('pointermove', (e) => {
  const t = timeAt(e.clientX), r = bar.getBoundingClientRect(), tip = $('tip');
  tip.style.left = `${e.clientX - r.left}px`;
  tip.textContent = chapters.length ? `${fmt(t)}  ${chapters[chapterAt(t)].title}` : fmt(t);
  if (dragging) seek(t);
});
bar.addEventListener('pointerup', () => { dragging = false; });

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === ' ' || k === 'k' || k === 'K') toggle();
  else if (k === 'ArrowLeft' || k === 'j' || k === 'J') seek(v.currentTime - 10);
  else if (k === 'ArrowRight' || k === 'l' || k === 'L') seek(v.currentTime + 10);
  else if (k === 'PageUp' || k === 'ArrowUp') jumpChapter(-1);
  else if (k === 'PageDown' || k === 'ArrowDown') jumpChapter(1);
  else if (k === 'Home') seek(0);
  else if (k === 'f' || k === 'F') fullscreen();
  else if (k === 'm' || k === 'M') v.muted = !v.muted;
  else if (k === 'c' || k === 'C') $('chapters').hidden = !$('chapters').hidden;
  else if (/^[1-9]$/.test(k) && chapters[Number(k) - 1]) seek(chapters[Number(k) - 1].start);
  else return;
  e.preventDefault();
  poke();
});

// Controls and the cursor fade after three seconds without input while playing.
let idleTimer = 0;
function poke() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!v.paused && !dragging) document.body.classList.add('idle'); }, 3000);
}
['pointermove', 'pointerdown', 'touchstart'].forEach((e) => document.addEventListener(e, poke, { passive: true }));
v.addEventListener('pause', poke);
v.addEventListener('play', poke);

// Some players drop the loop after a decode stall or a sleep, so a stall or an error restarts playback.
// A pause by the viewer stays paused.
const play = () => v.play().catch(() => {});
v.addEventListener('stalled', () => { if (!v.paused) play(); });
v.addEventListener('error', () => setTimeout(() => { const t = v.currentTime; v.load(); v.currentTime = t; play(); }, 2000));
document.addEventListener('visibilitychange', () => { if (!document.hidden && !v.paused) play(); });
play();
poke();
update();
</script>
</body>
</html>
