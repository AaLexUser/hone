version: 1

# Hone's configuration for the booth stack. docker-compose.yml mounts this file
# into the hone container and points HONE_CONFIG at it. As in the paper, each
# MAJICS panel mixes three model families (Hy3, LongCat and MiniMax), and both
# judges use a fourth family (GLM). LongCat replaced MiMo, whose seat kept
# hitting transport retries, and Hy3 replaced DeepSeek, whose endpoint kept
# answering 429 overloaded. DeepSeek stays defined as the agent's model. All four come from OpenCode Go with the key
# from OPENCODE_API_KEY in .env. The agent under optimization keeps the Pi
# agent's model in t3code. Each model's thinking map and compat flags are
# copied from Pi's model catalog.

service:
  data_dir: /data
  ui_dir: apps/web/dist
  # Harbor's sandboxes call Hone back by its alias on the sandbox network.
  announce_host: hone.internal

target:
  model: opencode-go/deepseek-v4.1-flash

majics:
  providers:
    opencode-go:
      name: OpenCode Go
      base_url: https://opencode.ai/inference/go/openai/v1
      api: openai-completions
      api_key_env: OPENCODE_API_KEY

  models:
    deepseek-v4.1-flash:
      provider: opencode-go
      id: deepseek-v4.1-flash
      name: DeepSeek V4.1 Flash
      reasoning: true
      input: [text]
      context_window: 1000000
      max_tokens: 128000
      thinking_level_map:
        "off": null
        minimal: null
        low: low
        medium: null
        high: high
        xhigh: null
        max: max
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        supportsStrictMode: true
        maxTokensField: max_tokens
        requiresReasoningContentOnAssistantMessages: true
        thinkingFormat: deepseek

    # The seats use the OpenCode Go models with the largest request allowance
    # per five hours in each family, so one key lasts through the booth while
    # the panels still span three families and the judges a fourth.
    hy3:
      provider: opencode-go
      id: hy3
      name: Hy3
      reasoning: true
      input: [text]
      context_window: 256000
      max_tokens: 128000
      thinking_level_map:
        "off": none
        minimal: null
        low: low
        medium: null
        high: high
        xhigh: null
        max: null
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        supportsStrictMode: true
        maxTokensField: max_tokens

    longcat-2.0:
      provider: opencode-go
      id: longcat-2.0
      name: LongCat 2.0
      reasoning: true
      input: [text]
      context_window: 1000000
      max_tokens: 131072
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        supportsStrictMode: true
        maxTokensField: max_tokens

    minimax-m3.1-flash:
      provider: opencode-go
      id: minimax-m3.1-flash
      name: MiniMax M3.1 Flash
      reasoning: true
      input: [text]
      context_window: 1000000
      max_tokens: 512000
      thinking_level_map:
        "off": null
        minimal: null
        low: low
        medium: medium
        high: high
        xhigh: xhigh
        max: max
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        supportsStrictMode: true
        maxTokensField: max_tokens

    glm-5.3-flash:
      provider: opencode-go
      id: glm-5.3-flash
      name: GLM 5.3 Flash
      reasoning: true
      input: [text]
      context_window: 1000000
      max_tokens: 131072
      thinking_level_map:
        "off": null
        minimal: null
        low: low
        medium: null
        high: high
        xhigh: null
        max: max
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        supportsStrictMode: true
        maxTokensField: max_tokens

  # A judge's ask_panel follow-up must answer within the driver's 60 s
  # deadline, so each panel model runs at the highest reasoning level that
  # still answers in time.
  review:
    panel:
      - model: longcat-2.0
        reasoning: low
      - model: hy3
        reasoning: low
      - model: minimax-m3.1-flash
        reasoning: high
    judge:
      model: glm-5.3-flash
      reasoning: high

  propose:
    panel:
      - model: hy3
        reasoning: low
      - model: minimax-m3.1-flash
        reasoning: high
      - model: longcat-2.0
        reasoning: low
    judge:
      model: glm-5.3-flash
      reasoning: high
