version: 1

# Hone's configuration for the booth stack. docker-compose.yml mounts this file
# into the hone container and points HONE_CONFIG at it. As in the paper, each
# MAJICS panel mixes three model families (MiniMax, DeepSeek and Hy3 for review,
# MiniMax, DeepSeek and Qwen for proposals), and both judges use GLM. Every worker turn must finish within the
# turn limit in optimization.turn_timeout_s and every follow-up within
# optimization.follow_up_timeout_s. MiMo, LongCat and Kimi ran past the turn
# limit, so faster models took their seats. Qwen reviewed too slowly on long
# sessions at every reasoning level, so Hy3 reviews and Qwen only proposes. The
# judges run the full GLM 5.3, because GLM 5.3 Flash kept rules the paper's
# recurrence rule rejects. All models come from OpenCode Go with the key from
# OPENCODE_API_KEY in .env. The agent under optimization keeps the Pi agent's
# model in t3code. Each model's thinking map and compat flags are copied from
# Pi's model catalog.

service:
  data_dir: /data
  ui_dir: apps/web/dist
  # Harbor's sandboxes call Hone back by its alias on the sandbox network.
  announce_host: hone.internal

target:
  model: opencode-go/deepseek-v4.1-flash

majics:
  providers:
    opencode-go:
      name: OpenCode Go
      base_url: https://opencode.ai/inference/go/openai/v1
      api: openai-completions
      api_key_env: OPENCODE_API_KEY

  models:
    deepseek-v4.1-flash:
      provider: opencode-go
      id: deepseek-v4.1-flash
      name: DeepSeek V4.1 Flash
      reasoning: true
      input: [text]
      context_window: 1000000
      max_tokens: 128000
      thinking_level_map:
        "off": null
        minimal: null
        low: low
        medium: null
        high: high
        xhigh: null
        max: max
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        supportsStrictMode: true
        maxTokensField: max_tokens
        requiresReasoningContentOnAssistantMessages: true
        thinkingFormat: deepseek

    # The seats use the OpenCode Go models with the largest request allowance
    # per five hours in each family, so one key lasts through the booth while
    # the panels still span three families and the judges a fourth.
    hy3:
      provider: opencode-go
      id: hy3
      name: Hy3
      reasoning: true
      input: [text]
      context_window: 256000
      max_tokens: 128000
      thinking_level_map:
        "off": none
        minimal: null
        low: low
        medium: null
        high: high
        xhigh: null
        max: null
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        supportsStrictMode: true
        maxTokensField: max_tokens

    # Pi's catalog lists Qwen on OpenCode Go's Anthropic endpoint. The OpenAI
    # endpoint serves it too, with tool calls and reasoning effort, so it
    # shares the provider of the other seats.
    qwen3.8-flash:
      provider: opencode-go
      id: qwen3.8-flash
      name: Qwen3.8 Flash
      reasoning: true
      input: [text]
      context_window: 1000000
      max_tokens: 131072
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        supportsStrictMode: true
        maxTokensField: max_tokens

    minimax-m3.1-flash:
      provider: opencode-go
      id: minimax-m3.1-flash
      name: MiniMax M3.1 Flash
      reasoning: true
      input: [text]
      context_window: 1000000
      max_tokens: 512000
      thinking_level_map:
        "off": null
        minimal: null
        low: low
        medium: medium
        high: high
        xhigh: xhigh
        max: max
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        supportsStrictMode: true
        maxTokensField: max_tokens

    glm-5.3:
      provider: opencode-go
      id: glm-5.3
      name: GLM 5.3
      reasoning: true
      input: [text]
      context_window: 1000000
      max_tokens: 131072
      thinking_level_map:
        "off": null
        minimal: null
        low: low
        medium: null
        high: high
        xhigh: null
        max: max
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        supportsStrictMode: true
        maxTokensField: max_tokens

  # A judge's ask_panel follow-up must answer within follow_up_timeout_s
  # (below), so each panel model runs at the highest reasoning level that
  # still answers in time. The first reviewer runs MiniMax at medium, because
  # at high its deep read of the batch once ran past the turn limit.
  review:
    # The first reviewer seat deep reads the whole batch, so the fastest model sits there.
    panel:
      - model: minimax-m3.1-flash
        reasoning: medium
      - model: deepseek-v4.1-flash
        reasoning: low
      - model: hy3
        reasoning: low
    judge:
      model: glm-5.3
      reasoning: high

  propose:
    panel:
      - model: deepseek-v4.1-flash
        reasoning: low
      - model: minimax-m3.1-flash
        reasoning: high
      - model: qwen3.8-flash
        reasoning: medium
    judge:
      model: glm-5.3
      reasoning: high

optimization:
  # The judges' follow-up questions often make a reviewer re-check a trace,
  # which takes longer than the default 60 seconds.
  follow_up_timeout_s: 120
  # A seat's deep read of a batch of long sessions sometimes passed the default
  # five minute turn limit, on a different model each time, so seats get eight.
  turn_timeout_s: 480
