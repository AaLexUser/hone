<svg class="dia" viewBox="0 -24 840 364" font-family="Inter, sans-serif" role="img" aria-label="Hone architecture: optional user feedback and settled agent sessions form a frozen batch; three reviewers on different LLMs are cross-examined by a review judge into a review report; three proposers read the report and the experience memory and are cross-examined by a propose judge into a proposal of edits and a commit message; a verifier checks anchor and evidence; accepted edits are applied and committed to Git and the published AGENTS.md is served to the agent, which the agent fetches before its next session; the experience memory is updated after commits; a rejected proposal returns to the propose stage with the review reused">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#111318"/></marker>
    <marker id="arh" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4653c9"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6b6658"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b42318"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3540a6"/></marker>
  </defs>

  <!-- 1 inputs -->
  <rect x="0.5" y="8" width="150" height="46" rx="6" fill="#fff" stroke="#111318" stroke-width="0.7"/>
  <path d="M 10 18 h 18 a 3 3 0 0 1 3 3 v 9 a 3 3 0 0 1 -3 3 h -11 l -5 4.5 v -4.5 h -2 a 3 3 0 0 1 -3 -3 v -9 a 3 3 0 0 1 3 -3 z" fill="#fbe2b0" stroke="#d4861a" stroke-width="0.9"/>
  <text x="44" y="29" font-size="12.5" font-weight="800" fill="#111318">User feedback</text>
  <text x="44" y="43" font-size="10.5" fill="#474b56">optional</text>
  <rect x="0.5" y="62" width="150" height="62" rx="6" fill="#fff" stroke="#111318" stroke-width="0.7"/>
  <g transform="translate(9,78) scale(0.62)">
    <rect x="0" y="6" width="30" height="36" rx="2.5" fill="#fff" stroke="#111318" stroke-width="1.4"/>
    <rect x="5" y="3" width="30" height="36" rx="2.5" fill="#fff" stroke="#111318" stroke-width="1.4"/>
    <rect x="10" y="0" width="30" height="36" rx="2.5" fill="#fff" stroke="#111318" stroke-width="1.4"/>
    <g stroke="#6b6658" stroke-width="2.6" stroke-linecap="round"><line x1="15" y1="9" x2="34" y2="9"/><line x1="15" y1="17" x2="30" y2="17"/><line x1="15" y1="25" x2="34" y2="25"/></g>
  </g>
  <text x="44" y="91" font-size="12.5" font-weight="800" fill="#111318">Settled agent</text>
  <text x="44" y="106" font-size="12.5" font-weight="800" fill="#111318">sessions</text>
  <circle cx="0.5" cy="8" r="8" fill="#4653c9"/><text x="0.5" y="12" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">1</text>
  <path d="M 151 31 L 159 31 L 159 93 L 151 93 M 159 62 L 167 62" fill="none" stroke="#111318" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- 2 frozen batch -->
  <rect x="169" y="8" width="84" height="116" rx="6" fill="#fff" stroke="#111318" stroke-width="0.7"/>
  <g transform="translate(193,28) scale(1.2)" fill="none" stroke="#111318" stroke-width="1.3" stroke-linejoin="round"><path d="M10 0 L20 5 L20 17 L10 22 L0 17 L0 5 Z"/><path d="M0 5 L10 10 L20 5 M10 10 L10 22"/></g>
  <text x="211" y="82" font-size="12.5" font-weight="800" fill="#111318" text-anchor="middle">Frozen</text>
  <text x="211" y="97" font-size="12.5" font-weight="800" fill="#111318" text-anchor="middle">batch</text>
  <text x="211" y="113" font-size="10.5" fill="#474b56" text-anchor="middle">n traces</text>
  <circle cx="169" cy="8" r="8" fill="#4653c9"/><text x="169" y="12" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">2</text>
  <line x1="253" y1="62" x2="267" y2="62" stroke="#111318" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- 3 review -->
  <rect x="269" y="8" width="352" height="116" rx="7" fill="#e2e5fb" stroke="#4653c9" stroke-width="1"/>
  <text x="283" y="27" font-size="11" font-weight="800" fill="#3540a6" font-family="JetBrains Mono, monospace" letter-spacing="0.7">REVIEW</text>
  <text x="351" y="27" font-size="11.5" fill="#111318">3 reviewers, different LLMs</text>
  <g font-size="11.5" font-weight="800" fill="#111318">
    <rect x="277" y="36" width="132" height="22" rx="11" fill="#fff" stroke="#111318" stroke-width="0.6"/><text x="289" y="51.5">Reviewer 1</text>
    <rect x="277" y="64" width="132" height="22" rx="11" fill="#fff" stroke="#111318" stroke-width="0.6"/><text x="289" y="79.5">Reviewer 2</text>
    <rect x="277" y="92" width="132" height="22" rx="11" fill="#fff" stroke="#111318" stroke-width="0.6"/><text x="289" y="107.5">Reviewer 3</text>
  </g>
  <g stroke="#4653c9" stroke-width="1.3" fill="none">
    <path d="M 410 47 C 424 47, 428 70, 442 73" marker-start="url(#arh)" marker-end="url(#arh)"/>
    <path d="M 410 75 L 442 75" marker-start="url(#arh)" marker-end="url(#arh)"/>
    <path d="M 410 103 C 424 103, 428 80, 442 77" marker-start="url(#arh)" marker-end="url(#arh)"/>
  </g>
  <rect x="444" y="36" width="168" height="78" rx="7" fill="#111318"/>
  <text x="454" y="58" font-size="13" font-weight="800" fill="#fff">Review judge</text>
  <text x="454" y="76" font-size="11" fill="#d9dbe3">cross-examines,</text>
  <text x="454" y="91" font-size="11" fill="#d9dbe3">asks follow-ups</text>
  <circle cx="269" cy="8" r="8" fill="#4653c9"/><text x="269" y="12" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">3</text>

  <!-- review report -->
  <line x1="622" y1="68" x2="650" y2="68" stroke="#111318" stroke-width="1.3" marker-end="url(#ar)"/>
  <rect x="652" y="38" width="188" height="60" rx="6" fill="#fff" stroke="#4653c9" stroke-width="1.3"/>
  <g transform="translate(664,56)"><path d="M0 0 h13 l5 5 v18 h-18 z" fill="#fff" stroke="#4653c9" stroke-width="1.2"/><g stroke="#4653c9" stroke-width="1.4"><line x1="4" y1="11" x2="14" y2="11"/><line x1="4" y1="16" x2="14" y2="16"/></g></g>
  <text x="692" y="73" font-size="13" font-weight="800" fill="#111318">Review report</text>
  <line x1="746" y1="99" x2="746" y2="194" stroke="#111318" stroke-width="1.3" marker-end="url(#ar)"/>


  <!-- mining labels: signals, patterns, decisions -->
  <g fill="none" stroke="#c27a12" stroke-width="1.2">
    <path d="M 181 1 V -3 H 253 V 1"/>
    <path d="M 277 1 V -3 H 409 V 1"/>
    <path d="M 444 1 V -3 H 612 V 1"/>
  </g>
  <g font-size="13" font-weight="800" fill="#7a4100" text-anchor="middle" font-family="Inter Display, Inter, sans-serif">
    <text x="217" y="-9">Signals</text>
    <text x="343" y="-9">Patterns</text>
    <text x="528" y="-9">Decisions</text>
  </g>
  <!-- experience memory -->
  <rect x="340" y="128" width="330" height="44" rx="6" fill="#fff" stroke="#6b6658" stroke-width="1.1" stroke-dasharray="4 2.5"/>
  <g transform="translate(350,139)" fill="none" stroke="#6b6658" stroke-width="1.3"><ellipse cx="7" cy="3" rx="7" ry="3"/><path d="M0 3 v14 a7 3 0 0 0 14 0 v-14 M0 10 a7 3 0 0 0 14 0"/></g>
  <text x="374" y="146" font-size="12.5" font-weight="800" fill="#111318">Experience memory</text>
  <text x="374" y="162" font-size="10.5" fill="#474b56">past edits and their outcomes, read by the proposers</text>
  <path d="M 640 173 L 640 194" fill="none" stroke="#6b6658" stroke-width="1.3" stroke-dasharray="4 2.5" marker-end="url(#arg)"/>
  <path d="M 190 196 L 190 150 L 338 150" fill="none" stroke="#6b6658" stroke-width="1.3" stroke-dasharray="4 2.5" marker-end="url(#arg)"/>
  <text x="198" y="144" font-size="10.5" fill="#474b56">updated after each commit</text>

  <!-- the agent's next session -->
  <rect x="0.5" y="134" width="170" height="28" rx="14" fill="#fff" stroke="#3540a6" stroke-width="1.3"/>
  <text x="85.5" y="152.5" font-size="12.5" font-weight="800" fill="#111318" text-anchor="middle">Agent · next session</text>
  <path d="M 64 195 L 64 165" fill="none" stroke="#3540a6" stroke-width="2.6" marker-end="url(#arb)"/>
  <text x="73" y="176" font-size="10.5" font-weight="800" fill="#3540a6">fetches the latest</text>
  <text x="73" y="189" font-size="10.5" font-weight="800" fill="#3540a6">AGENTS.md</text>

  <!-- 4 propose -->
  <g transform="translate(0,16)">

  <rect x="498" y="180" width="342" height="116" rx="7" fill="#e2e5fb" stroke="#4653c9" stroke-width="1"/>
  <text x="512" y="199" font-size="11" font-weight="800" fill="#3540a6" font-family="JetBrains Mono, monospace" letter-spacing="0.7">PROPOSE</text>
  <text x="590" y="199" font-size="11.5" fill="#111318">3 proposers, different LLMs</text>
  <g font-size="11.5" font-weight="800" fill="#111318">
    <rect x="506" y="208" width="132" height="22" rx="11" fill="#fff" stroke="#111318" stroke-width="0.6"/><text x="518" y="223.5">Proposer 1</text>
    <rect x="506" y="236" width="132" height="22" rx="11" fill="#fff" stroke="#111318" stroke-width="0.6"/><text x="518" y="251.5">Proposer 2</text>
    <rect x="506" y="264" width="132" height="22" rx="11" fill="#fff" stroke="#111318" stroke-width="0.6"/><text x="518" y="279.5">Proposer 3</text>
  </g>
  <g stroke="#4653c9" stroke-width="1.3" fill="none">
    <path d="M 639 219 C 653 219, 657 242, 671 245" marker-start="url(#arh)" marker-end="url(#arh)"/>
    <path d="M 639 247 L 671 247" marker-start="url(#arh)" marker-end="url(#arh)"/>
    <path d="M 639 275 C 653 275, 657 252, 671 249" marker-start="url(#arh)" marker-end="url(#arh)"/>
  </g>
  <rect x="673" y="208" width="159" height="78" rx="7" fill="#111318"/>
  <text x="683" y="230" font-size="13" font-weight="800" fill="#fff">Propose judge</text>
  <text x="683" y="248" font-size="11" fill="#d9dbe3">cross-examines,</text>
  <text x="683" y="263" font-size="11" fill="#d9dbe3">asks follow-ups</text>
  <circle cx="498" cy="180" r="8" fill="#4653c9"/><text x="498" y="184" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">4</text>

  <!-- proposal -->
  <line x1="497" y1="238" x2="478" y2="238" stroke="#111318" stroke-width="1.3" marker-end="url(#ar)"/>
  <rect x="344" y="198" width="132" height="80" rx="6" fill="#fff" stroke="#4653c9" stroke-width="1.3"/>
  <g transform="translate(356,210)"><path d="M0 0 h13 l5 5 v18 h-18 z" fill="#fff" stroke="#4653c9" stroke-width="1.2"/><g stroke="#4653c9" stroke-width="1.4"><line x1="4" y1="11" x2="14" y2="11"/><line x1="4" y1="16" x2="14" y2="16"/></g></g>
  <text x="380" y="226" font-size="13" font-weight="800" fill="#111318">Proposal</text>
  <text x="356" y="250" font-size="11" fill="#474b56">edits +</text>
  <text x="356" y="265" font-size="11" fill="#474b56">commit message</text>

  <!-- 5 verifier -->
  <line x1="343" y1="238" x2="328" y2="238" stroke="#111318" stroke-width="1.3" marker-end="url(#ar)"/>
  <rect x="246" y="180" width="80" height="116" rx="6" fill="#fff" stroke="#111318" stroke-width="0.7"/>
  <g transform="translate(270,192) scale(1.15)"><path d="M12 0 L24 5 V15 C24 24 18 29 12 32 C6 29 0 24 0 15 V5 Z" fill="#111318"/><path d="M6.5 16 L10.5 20 L18 11" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="286" y="250" font-size="13" font-weight="800" fill="#111318" text-anchor="middle">Verifier</text>
  <text x="286" y="266" font-size="10.5" fill="#474b56" text-anchor="middle">anchor +</text>
  <text x="286" y="279" font-size="10.5" fill="#474b56" text-anchor="middle">evidence</text>
  <circle cx="246" cy="180" r="8" fill="#4653c9"/><text x="246" y="184" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">5</text>
  <path d="M 286 297 L 286 312 Q 286 317 291 317 L 663 317 Q 668 317 668 312 L 668 298" fill="none" stroke="#b42318" stroke-width="1.3" stroke-dasharray="3.5 2.5" marker-end="url(#arr)"/>
  <text x="304" y="311" font-size="11" fill="#b42318" font-weight="800">rejected: re-propose, the review is reused</text>

  <!-- accept -> git commit -->
  <line x1="245" y1="238" x2="230" y2="238" stroke="#111318" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="237.5" y="229" font-size="12" fill="#0d4a2a" font-weight="800" text-anchor="middle">✓</text>
  <rect x="144" y="180" width="84" height="116" rx="6" fill="#111318"/>
  <g transform="translate(176,194)" stroke="#a9b2ff" stroke-width="2.2" fill="none"><line x1="6" y1="0" x2="6" y2="30"/><circle cx="6" cy="9" r="4.8" fill="#111318"/><circle cx="6" cy="22" r="4.8" fill="#a9b2ff"/></g>
  <text x="186" y="252" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle">Git commit</text>
  <text x="186" y="268" font-size="10.5" fill="#d9dbe3" text-anchor="middle">edits applied</text>

  <!-- published AGENTS.md, served to the agent -->
  <line x1="143" y1="238" x2="130" y2="238" stroke="#111318" stroke-width="1.3" marker-end="url(#ar)"/>
  <rect x="0.5" y="180" width="128" height="116" rx="6" fill="#fff" stroke="#4653c9" stroke-width="1.4" stroke-dasharray="4 2.5"/>
  <g transform="translate(51,192) scale(1.3)"><path d="M0 0 h11 l4 4 v15 h-15 z" fill="#fff" stroke="#111318" stroke-width="0.9"/><g stroke="#4653c9" stroke-width="1.5"><line x1="3" y1="8" x2="12" y2="8"/><line x1="3" y1="12" x2="12" y2="12"/><line x1="3" y1="16" x2="9" y2="16"/></g></g>
  <text x="64" y="246" font-size="11" font-weight="800" fill="#3540a6" text-anchor="middle">Published</text>
  <text x="64" y="263" font-size="12.5" font-weight="800" fill="#111318" text-anchor="middle" font-family="JetBrains Mono, monospace">AGENTS.md</text>
  <text x="64" y="281" font-size="10.5" fill="#474b56" text-anchor="middle">served to the agent</text>
  </g>
</svg>
