<svg viewBox="0 0 820 192" font-family="Inter" aria-label="Hone pipeline">
  <defs>
    <marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse" viewBox="0 0 7 7"><path d="M0,0 L7,3.5 L0,7 z" fill="#2b2e36"/></marker>
    <marker id="ag" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 7 7"><path d="M0,0 L7,3.5 L0,7 z" fill="#6e7280"/></marker>
    <marker id="ab" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse" viewBox="0 0 5 5"><path d="M0,0 L5,2.5 L0,5 z" fill="#4653c9"/></marker>
  </defs>

  <!-- feedback loops -->
  <path d="M675 52 V16 H529 V32" fill="none" stroke="#6e7280" stroke-width="0.8" marker-end="url(#ag)"/>
  <text x="602" y="10" font-size="9" fill="#4a4e59" text-anchor="middle">rejected edits go back to the proposers</text>
  <path d="M778 140 V172 H61 V142" fill="none" stroke="#6e7280" stroke-width="0.8" marker-end="url(#ag)"/>
  <text x="420" y="187" font-size="9" fill="#4a4e59" text-anchor="middle">the agent fetches the current <tspan font-family="JetBrains Mono">AGENTS.md</tspan> before each session</text>

  <g stroke="#2b2e36" stroke-width="0.8" fill="none" marker-end="url(#ah)">
    <path d="M122 96 H136"/><path d="M242 96 H256"/><path d="M428 96 H442"/><path d="M614 96 H628"/><path d="M720 96 H734"/>
  </g>

  <!-- 1 sessions -->
  <rect x="0" y="52" width="122" height="88" rx="3" fill="#fff" stroke="#2b2e36" stroke-width="0.7"/>
  <g text-anchor="middle" fill="#111318"><text x="61" y="82" font-size="11.5" font-weight="700">Agent sessions</text>
  <text font-size="9" fill="#4a4e59"><tspan x="61" y="98">Pi agent traces</tspan><tspan x="61" y="110">with optional</tspan><tspan x="61" y="122">user comments</tspan></text></g>

  <!-- 2 batch -->
  <rect x="138" y="52" width="104" height="88" rx="3" fill="#fff" stroke="#2b2e36" stroke-width="0.7"/>
  <g text-anchor="middle" fill="#111318"><text x="190" y="82" font-size="11.5" font-weight="700">Frozen batch</text>
  <text font-size="9" fill="#4a4e59"><tspan x="190" y="98">unanalyzed</tspan><tspan x="190" y="110">sessions, fixed</tspan><tspan x="190" y="122">for the run</tspan></text></g>

  <!-- 3 review and 4 propose -->
  <g id="grp">
    <rect x="258" y="34" width="170" height="124" rx="4" fill="#e4e7fb"/>
    <text x="266" y="50" font-size="11.5" font-weight="700" fill="#3540a6">Review</text>
    <text x="420" y="50" font-size="9" fill="#3540a6" text-anchor="end">three LLMs</text>
    <g fill="#fff" stroke="#8b90a0" stroke-width="0.6">
      <rect x="266" y="62" width="72" height="24" rx="12"/><rect x="266" y="92" width="72" height="24" rx="12"/><rect x="266" y="122" width="72" height="24" rx="12"/>
    </g>
    <g font-size="9" fill="#111318" text-anchor="middle"><text x="302" y="77">Reviewer 1</text><text x="302" y="107">Reviewer 2</text><text x="302" y="137">Reviewer 3</text></g>
    <g stroke="#4653c9" stroke-width="0.7" marker-start="url(#ab)" marker-end="url(#ab)"><path d="M340 74 H356"/><path d="M340 104 H356"/><path d="M340 134 H356"/></g>
    <rect x="358" y="62" width="62" height="84" rx="3" fill="#fff" stroke="#4653c9" stroke-width="0.9"/>
    <g text-anchor="middle"><text x="389" y="96" font-size="11.5" font-weight="700" fill="#111318">Judge</text>
    <text font-size="9" fill="#4a4e59"><tspan x="389" y="111">questions</tspan><tspan x="389" y="123">the panel</tspan></text></g>
  </g>
  <g transform="translate(186 0)">
    <rect x="258" y="34" width="170" height="124" rx="4" fill="#e4e7fb"/>
    <text x="266" y="50" font-size="11.5" font-weight="700" fill="#3540a6">Propose</text>
    <text x="420" y="50" font-size="9" fill="#3540a6" text-anchor="end">three LLMs</text>
    <g fill="#fff" stroke="#8b90a0" stroke-width="0.6">
      <rect x="266" y="62" width="72" height="24" rx="12"/><rect x="266" y="92" width="72" height="24" rx="12"/><rect x="266" y="122" width="72" height="24" rx="12"/>
    </g>
    <g font-size="9" fill="#111318" text-anchor="middle"><text x="302" y="77">Proposer 1</text><text x="302" y="107">Proposer 2</text><text x="302" y="137">Proposer 3</text></g>
    <g stroke="#4653c9" stroke-width="0.7" marker-start="url(#ab)" marker-end="url(#ab)"><path d="M340 74 H356"/><path d="M340 104 H356"/><path d="M340 134 H356"/></g>
    <rect x="358" y="62" width="62" height="84" rx="3" fill="#fff" stroke="#4653c9" stroke-width="0.9"/>
    <g text-anchor="middle"><text x="389" y="96" font-size="11.5" font-weight="700" fill="#111318">Judge</text>
    <text font-size="9" fill="#4a4e59"><tspan x="389" y="111">merges</tspan><tspan x="389" y="123">the edits</tspan></text></g>
  </g>

  <!-- 5 verifier -->
  <rect x="630" y="52" width="90" height="88" rx="3" fill="#fff" stroke="#2b2e36" stroke-width="0.7"/>
  <g text-anchor="middle" fill="#111318"><text x="675" y="82" font-size="11.5" font-weight="700">Verifier</text>
  <text font-size="9" fill="#4a4e59"><tspan x="675" y="98">anchor found</tspan><tspan x="675" y="110">once, evidence</tspan><tspan x="675" y="122">in the batch</tspan></text></g>

  <!-- 6 git -->
  <rect x="736" y="52" width="84" height="88" rx="3" fill="#3540a6"/>
  <g text-anchor="middle" fill="#fff"><text x="778" y="82" font-size="11.5" font-weight="700" font-family="JetBrains Mono">AGENTS.md</text>
  <text font-size="9"><tspan x="778" y="98">committed</tspan><tspan x="778" y="110">to Git, every</tspan><tspan x="778" y="122">version kept</tspan></text></g>
</svg>
