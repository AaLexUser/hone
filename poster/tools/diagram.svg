  <svg viewBox="0 0 820 290" font-family="Inter" aria-label="Hone architecture">
    <defs>
      <marker id="a-ink" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 6 6"><path d="M0,0 L6,3 L0,6 z" fill="#1a1c21"/></marker>
      <marker id="a-rev" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse" viewBox="0 0 5 5"><path d="M0,0 L5,2.5 L0,5 z" fill="#3540a6"/></marker>
      <marker id="a-pro" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse" viewBox="0 0 5 5"><path d="M0,0 L5,2.5 L0,5 z" fill="#3540a6"/></marker>
      <marker id="a-gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 6 6"><path d="M0,0 L6,3 L0,6 z" fill="#7d7a73"/></marker>
      <marker id="a-rej" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 6 6"><path d="M0,0 L6,3 L0,6 z" fill="#b0302f"/></marker>
      <marker id="a-acc" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 7 7"><path d="M0,0 L7,3.5 L0,7 z" fill="#4653c9"/></marker>
      <symbol id="i-msg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g></symbol>
      <symbol id="i-pkg" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></g></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></g></symbol>
      <symbol id="i-db" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></g></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7.5"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></g></symbol>
      <symbol id="i-scale" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.920 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></g></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></g></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></g></symbol>
      <symbol id="i-git" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><line x1="1" y1="12" x2="8" y2="12"/><line x1="16" y1="12" x2="23" y2="12"/></g></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></g></symbol>
      <g id="stg"><circle r="7.5" fill="#3540a6" stroke="#ffffff" stroke-width="1.4"/></g>
    </defs>

    <!-- ===== inputs ===== -->
    <rect x="0" y="4" width="140" height="40" rx="3" fill="#ffffff" stroke="#8b867c" stroke-width="0.6"/>
    <use href="#i-msg" x="9" y="11" width="13" height="13" style="color:#565b66"/>
    <text x="29" y="22" font-size="11" font-weight="700">User feedback</text>
    <text x="29" y="37" font-size="9" fill="#565b66">optional, free text</text>

    <rect x="0" y="50" width="140" height="56" rx="3" fill="#ffffff" stroke="#8b867c" stroke-width="0.6"/>
    <use href="#i-users" x="9" y="57" width="13" height="13" style="color:#565b66"/>
    <text x="29" y="67" font-size="11" font-weight="700">Settled agent</text>
    <text x="29" y="80" font-size="11" font-weight="700">sessions</text>
    <text x="29" y="97" font-size="9" fill="#565b66">Pi extension traces</text>

    <path d="M140 24 H151 V78 H140" fill="none" stroke="#1a1c21" stroke-width="0.7"/>
    <line x1="151" y1="51" x2="164" y2="51" stroke="#1a1c21" stroke-width="0.7" marker-end="url(#a-ink)"/>

    <rect x="166" y="4" width="164" height="102" rx="3" fill="#ffffff" stroke="#1a1c21" stroke-width="0.6" stroke-dasharray="3 2"/>
    <use href="#i-pkg" x="239" y="13" width="18" height="18" style="color:#565b66"/>
    <text x="248" y="47" font-size="11" font-weight="700" text-anchor="middle">Frozen batch</text>
    <text x="248" y="63" font-size="9" fill="#565b66" text-anchor="middle">unanalyzed traces,</text>
    <text x="248" y="75" font-size="9" fill="#565b66" text-anchor="middle">size set by the user,</text>
    <text x="248" y="87" font-size="9" fill="#565b66" text-anchor="middle">fixed for the run</text>

    <!-- ===== REVIEW ===== -->
    <rect x="394" y="0" width="268" height="122" rx="5" fill="#e2e5fb" stroke="#3540a6" stroke-width="0.8"/>
    <text x="405" y="16" font-size="11" font-weight="700" fill="#3540a6">Review</text>
    <text x="458" y="16" font-size="9" fill="#3540a6">3 reviewers, different LLMs, same prompt</text>

    <line x1="330" y1="62" x2="399" y2="62" stroke="#1a1c21" stroke-width="0.7"/>
    <path d="M399 34 V90" fill="none" stroke="#1a1c21" stroke-width="0.7"/>
    <line x1="399" y1="34" x2="405" y2="34" stroke="#1a1c21" stroke-width="0.7" marker-end="url(#a-ink)"/>
    <line x1="399" y1="62" x2="405" y2="62" stroke="#1a1c21" stroke-width="0.7" marker-end="url(#a-ink)"/>
    <line x1="399" y1="90" x2="405" y2="90" stroke="#1a1c21" stroke-width="0.7" marker-end="url(#a-ink)"/>

    <g font-size="10">
      <rect x="407" y="22" width="102" height="24" rx="12" fill="#fff" stroke="#3540a6" stroke-width="0.6"/>
      <use href="#i-search" x="415" y="28.5" width="11" height="11" style="color:#3540a6"/>
      <text x="431" y="37.5" fill="#1f2b55">Reviewer R₁</text>
      <rect x="407" y="50" width="102" height="24" rx="12" fill="#fff" stroke="#3540a6" stroke-width="0.6"/>
      <use href="#i-search" x="415" y="56.5" width="11" height="11" style="color:#3540a6"/>
      <text x="431" y="65.5" fill="#1f2b55">Reviewer R₂</text>
      <rect x="407" y="78" width="102" height="24" rx="12" fill="#fff" stroke="#3540a6" stroke-width="0.6"/>
      <use href="#i-search" x="415" y="84.5" width="11" height="11" style="color:#3540a6"/>
      <text x="431" y="93.5" fill="#1f2b55">Reviewer R₃</text>
    </g>

    <g stroke="#3540a6" stroke-width="0.8" fill="none" marker-start="url(#a-rev)" marker-end="url(#a-rev)">
      <line x1="511" y1="36" x2="546" y2="50"/>
      <line x1="511" y1="62" x2="546" y2="62"/>
      <line x1="511" y1="88" x2="546" y2="74"/>
    </g>
    <rect x="548" y="22" width="106" height="80" rx="4" fill="#fff" stroke="#3540a6" stroke-width="1.2"/>
    <use href="#i-scale" x="593" y="26" width="16" height="16" style="color:#3540a6"/>
    <text x="601" y="56" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2b55">Review judge</text>
    <text x="601" y="71" font-size="9" text-anchor="middle" fill="#565b66">cross-examines,</text>
    <text x="601" y="82" font-size="9" text-anchor="middle" fill="#565b66">asks follow-ups,</text>
    <text x="601" y="93" font-size="9" text-anchor="middle" fill="#565b66">writes consensus</text>
    <text x="418" y="116" font-size="9" font-style="italic" fill="#3540a6">↔ the judge re-queries the reviewers</text>

    <line x1="654" y1="62" x2="683" y2="62" stroke="#1a1c21" stroke-width="0.7" marker-end="url(#a-ink)"/>
    <rect x="685" y="22" width="135" height="80" rx="3" fill="#fff" stroke="#3540a6" stroke-width="1.1"/>
    <use href="#i-file" x="694" y="31" width="13" height="13" style="color:#3540a6"/>
    <text x="712" y="40" font-size="11" font-weight="700" fill="#1f2b55">Review report</text>
    <text x="694" y="56" font-size="9" fill="#565b66">findings, hypotheses</text>
    <text x="694" y="68" font-size="9" fill="#565b66">with confidence,</text>
    <text x="694" y="80" font-size="9" fill="#565b66">linked traces,</text>
    <text x="694" y="92" font-size="9" fill="#565b66">unresolved questions</text>

    <text x="746" y="118" font-size="9" fill="#565b66" text-anchor="end">both stages run as</text>
    <text x="746" y="130" font-size="9" fill="#565b66" text-anchor="end">sandboxed jobs</text>

    <!-- report -> proposers -->
    <path d="M752 102 V154 H652 V236" fill="none" stroke="#1a1c21" stroke-width="0.7"/>

    <!-- ===== PROPOSE ===== -->
    <rect x="394" y="140" width="268" height="140" rx="5" fill="#e2e5fb" stroke="#3540a6" stroke-width="0.8"/>
    <path d="M662 154 H652 V236" fill="none" stroke="#1a1c21" stroke-width="0.7"/>
    <line x1="652" y1="180" x2="642" y2="180" stroke="#1a1c21" stroke-width="0.7" marker-end="url(#a-ink)"/>
    <line x1="652" y1="208" x2="642" y2="208" stroke="#1a1c21" stroke-width="0.7" marker-end="url(#a-ink)"/>
    <line x1="652" y1="236" x2="642" y2="236" stroke="#1a1c21" stroke-width="0.7" marker-end="url(#a-ink)"/>
    <text x="405" y="156" font-size="11" font-weight="700" fill="#3540a6">Propose</text>
    <text x="467" y="156" font-size="9" fill="#3540a6">3 proposers, different LLMs</text>

    <g font-size="10">
      <rect x="536" y="168" width="104" height="24" rx="12" fill="#fff" stroke="#3540a6" stroke-width="0.6"/>
      <use href="#i-pen" x="544" y="174.5" width="11" height="11" style="color:#3540a6"/>
      <text x="560" y="183.5" fill="#1f2b55">Proposer P₁</text>
      <rect x="536" y="196" width="104" height="24" rx="12" fill="#fff" stroke="#3540a6" stroke-width="0.6"/>
      <use href="#i-pen" x="544" y="202.5" width="11" height="11" style="color:#3540a6"/>
      <text x="560" y="211.5" fill="#1f2b55">Proposer P₂</text>
      <rect x="536" y="224" width="104" height="24" rx="12" fill="#fff" stroke="#3540a6" stroke-width="0.6"/>
      <use href="#i-pen" x="544" y="230.5" width="11" height="11" style="color:#3540a6"/>
      <text x="560" y="239.5" fill="#1f2b55">Proposer P₃</text>
    </g>
    <g stroke="#3540a6" stroke-width="0.8" fill="none" marker-start="url(#a-pro)" marker-end="url(#a-pro)">
      <line x1="534" y1="182" x2="512" y2="194"/>
      <line x1="534" y1="208" x2="512" y2="208"/>
      <line x1="534" y1="234" x2="512" y2="222"/>
    </g>
    <rect x="404" y="168" width="106" height="80" rx="4" fill="#fff" stroke="#3540a6" stroke-width="1.2"/>
    <use href="#i-scale" x="449" y="172" width="16" height="16" style="color:#3540a6"/>
    <text x="457" y="202" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2b55">Propose judge</text>
    <text x="457" y="217" font-size="9" text-anchor="middle" fill="#565b66">cross-examines,</text>
    <text x="457" y="228" font-size="9" text-anchor="middle" fill="#565b66">asks follow-ups,</text>
    <text x="457" y="239" font-size="9" text-anchor="middle" fill="#565b66">fuses one edit set</text>

    <line x1="457" y1="248" x2="457" y2="253" stroke="#1a1c21" stroke-width="0.7" marker-end="url(#a-ink)"/>
    <rect x="404" y="254" width="246" height="22" rx="3" fill="#fff" stroke="#3540a6" stroke-width="1.1"/>
    <use href="#i-file" x="411" y="259" width="12" height="12" style="color:#3540a6"/>
    <text x="428" y="268.8" font-size="11" font-weight="700" fill="#1f2b55">Edit set</text>
    <text x="482" y="268.8" font-size="9" fill="#565b66">anchored edits + commit message</text>

    <!-- experience memory -->
    <rect x="685" y="170" width="135" height="74" rx="3" fill="#ffffff" stroke="#1a1c21" stroke-width="0.6" stroke-dasharray="3 2"/>
    <use href="#i-db" x="694" y="178" width="13" height="13" style="color:#565b66"/>
    <text x="712" y="188" font-size="11" font-weight="700">Experience</text>
    <text x="694" y="202" font-size="11" font-weight="700">memory</text>
    <text x="694" y="217" font-size="9" fill="#565b66">each past edit, its</text>
    <text x="694" y="228" font-size="9" fill="#565b66">commit message,</text>
    <text x="694" y="239" font-size="9" fill="#565b66">rationale and outcome</text>
    <line x1="685" y1="222" x2="653" y2="222" stroke="#7d7a73" stroke-width="0.7" stroke-dasharray="3 2"/>

    <!-- ===== verify, commit, publish ===== -->
    <path d="M404 265 H380" fill="none" stroke="#1a1c21" stroke-width="0.7" marker-end="url(#a-ink)"/>
    <rect x="270" y="182" width="108" height="90" rx="4" fill="#f1e8d2" stroke="#806217" stroke-width="1.1"/>
    <use href="#i-shield" x="316" y="187" width="16" height="16" style="color:#806217"/>
    <text x="324" y="217" font-size="11.5" font-weight="700" text-anchor="middle" fill="#4f3c0c">Verifier</text>
    <text x="324" y="232" font-size="9" text-anchor="middle" fill="#565b66">anchor matches</text>
    <text x="324" y="243" font-size="9" text-anchor="middle" fill="#565b66">once in the file,</text>
    <text x="324" y="254" font-size="9" text-anchor="middle" fill="#565b66">cited evidence</text>
    <text x="324" y="265" font-size="9" text-anchor="middle" fill="#565b66">is in the batch</text>

    <path d="M324 182 V135 H470 V138" fill="none" stroke="#b0302f" stroke-width="0.8" stroke-dasharray="4 2.4" marker-end="url(#a-rej)"/>
    <text x="214" y="132" font-size="9" font-style="italic" fill="#b0302f">on rejection, only propose re-runs and reuses the review</text>

    <line x1="270" y1="227" x2="249" y2="227" stroke="#1a1c21" stroke-width="0.7" marker-end="url(#a-ink)"/>
    <text x="259.5" y="221" font-size="9" font-weight="700" fill="#3540a6" text-anchor="middle">✓</text>
    <rect x="151" y="182" width="96" height="90" rx="4" fill="#1a1c21"/>
    <use href="#i-git" x="191" y="189" width="16" height="16" style="color:#f4f2ed"/>
    <text x="199" y="220" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">Git commit</text>
    <text x="199" y="236" font-size="9" text-anchor="middle" fill="#c9c5bc">edits applied,</text>
    <text x="199" y="248" font-size="9" text-anchor="middle" fill="#c9c5bc">message by</text>
    <text x="199" y="260" font-size="9" text-anchor="middle" fill="#c9c5bc">the judge</text>

    <line x1="151" y1="227" x2="139" y2="227" stroke="#1a1c21" stroke-width="0.7" marker-end="url(#a-ink)"/>
    <rect x="0" y="182" width="137" height="90" rx="4" fill="#fff" stroke="#4653c9" stroke-width="1.6"/>
    <use href="#i-file" x="10" y="190" width="15" height="15" style="color:#4653c9"/>
    <text x="10" y="220" font-size="11" font-weight="700">Published</text>
    <text x="10" y="234" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#3540a6">AGENTS.md</text>
    <text x="10" y="251" font-size="9" fill="#565b66">every version in Git,</text>
    <text x="10" y="263" font-size="9" fill="#565b66">branch from any one</text>

    <!-- loop back to the agent -->
    <line x1="40" y1="182" x2="40" y2="164" stroke="#4653c9" stroke-width="1.1" marker-end="url(#a-acc)"/>
    <text x="47" y="176" font-size="9" fill="#3540a6" font-weight="600">fetch latest before each session</text>
    <rect x="0" y="122" width="140" height="40" rx="3" fill="#ffffff" stroke="#1a1c21" stroke-width="0.6" stroke-dasharray="3 2"/>
    <use href="#i-file" x="9" y="128" width="13" height="13" style="color:#565b66"/>
    <text x="29" y="138" font-family="JetBrains Mono" font-size="10.5" font-weight="700">AGENTS.md</text>
    <text x="29" y="154" font-size="9" fill="#565b66">the agent's copy</text>
    <line x1="40" y1="122" x2="40" y2="108" stroke="#1a1c21" stroke-width="0.7" marker-end="url(#a-ink)"/>
    <text x="47" y="118" font-size="9" fill="#565b66">loaded into every session</text>

    <!-- experience update -->
    <path d="M199 272 V286 H752 V246" fill="none" stroke="#7d7a73" stroke-width="0.7" stroke-dasharray="3 2" marker-end="url(#a-gray)"/>
    <text x="759" y="258" font-size="9" fill="#565b66">experience</text>
    <text x="759" y="270" font-size="9" fill="#565b66">update after</text>
    <text x="759" y="282" font-size="9" fill="#565b66">each commit</text>

    <!-- pipeline stages -->
    <use href="#stg" x="0" y="4"/><text x="0" y="7.4" font-size="9.6" font-weight="800" fill="#fff" text-anchor="middle">1</text>
    <use href="#stg" x="166" y="4"/><text x="166" y="7.4" font-size="9.6" font-weight="800" fill="#fff" text-anchor="middle">2</text>
    <use href="#stg" x="394" y="0"/><text x="394" y="3.4" font-size="9.6" font-weight="800" fill="#fff" text-anchor="middle">3</text>
    <use href="#stg" x="394" y="140"/><text x="394" y="143.4" font-size="9.6" font-weight="800" fill="#fff" text-anchor="middle">4</text>
    <use href="#stg" x="270" y="182"/><text x="270" y="185.4" font-size="9.6" font-weight="800" fill="#fff" text-anchor="middle">5</text>
  </svg>
