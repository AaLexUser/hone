<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 508" font-family="'JetBrains Mono','JetBrainsMono','Menlo','Consolas',monospace" font-size="11">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5566aa"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#3a7a5a"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
    <marker id="arrow-reject" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#b05050"/>
    </marker>

    <!-- Lucide icon symbols (24x24 viewBox) -->
    <symbol id="ic-users" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </g>
    </symbol>
    <symbol id="ic-message" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </g>
    </symbol>
    <symbol id="ic-package" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
        <line x1="12" y1="22.08" x2="12" y2="12"/>
      </g>
    </symbol>
    <symbol id="ic-file-text" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
      </g>
    </symbol>
    <symbol id="ic-database" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="12" cy="5" rx="9" ry="3"/>
        <path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/>
        <path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/>
      </g>
    </symbol>
    <symbol id="ic-search" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </g>
    </symbol>
    <symbol id="ic-scale" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
        <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
        <path d="M7 21h10"/><path d="M12 3v18"/>
        <path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>
      </g>
    </symbol>
    <symbol id="ic-pencil" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
        <path d="m15 5 4 4"/>
      </g>
    </symbol>
    <symbol id="ic-shield" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="m9 12 2 2 4-4"/>
      </g>
    </symbol>
    <symbol id="ic-git" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <line x1="1.05" y1="12" x2="7" y2="12"/>
        <line x1="17.01" y1="12" x2="22.96" y2="12"/>
      </g>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="730" height="508" fill="#fdfdfd"/>

  <!-- ==================== PARALLEL INPUTS PACKED INTO BATCH ==================== -->

  <!-- User Feedback -->
  <rect x="20" y="24" width="112" height="40" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <use href="#ic-message" x="24" y="38" width="12" height="12" style="color:#666"/>
  <text x="76" y="43" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">User Feedback</text>
  <text x="76" y="55" text-anchor="middle" font-size="7.5" fill="#777" font-style="italic">(optional)</text>

  <!-- Settled Agent Sessions -->
  <rect x="20" y="68" width="112" height="44" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <use href="#ic-users" x="28" y="78" width="12" height="12" style="color:#666"/>
  <text x="76" y="86" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Settled</text>
  <text x="76" y="99" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#333">Agent Sessions</text>

  <!-- Combined Arrow: User Feedback + Settled Sessions -> Frozen Batch -->
  <path d="M 132 44 L 146 44 L 146 90 L 132 90" fill="none" stroke="#333" stroke-width="1.1"/>
  <line x1="146" y1="67" x2="158" y2="67" stroke="#333" stroke-width="1.1" marker-end="url(#arrow)"/>

  <!-- Frozen Batch -->
  <rect x="160" y="24" width="96" height="88" rx="4" fill="#fff" stroke="#666" stroke-width="1" stroke-dasharray="4,2"/>
  <use href="#ic-package" x="202" y="42" width="13" height="13" style="color:#777"/>
  <text x="208" y="68" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#444">Frozen Batch</text>
  <text x="208" y="82" text-anchor="middle" font-size="8.5" fill="#777" font-style="italic">n traces</text>

  <!-- ==================== SECONDARY INPUTS ==================== -->

  <!-- AGENTS.md (Fetched from /agents.md) -->
  <rect x="20" y="124" width="112" height="42" rx="4" fill="#fff" stroke="#666" stroke-width="1" stroke-dasharray="4,2"/>
  <use href="#ic-file-text" x="70" y="128" width="12" height="12" style="color:#777"/>
  <text x="76" y="148" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">AGENTS.md</text>
  <text x="76" y="159" text-anchor="middle" font-size="7.5" fill="#777" font-style="italic">GET /agents.md</text>

  <!-- Experience Memory -->
  <rect x="160" y="124" width="96" height="42" rx="4" fill="#fff" stroke="#666" stroke-width="1" stroke-dasharray="4,2"/>
  <use href="#ic-database" x="202" y="129" width="12" height="12" style="color:#777"/>
  <text x="208" y="147" text-anchor="middle" font-size="8" font-weight="bold" fill="#444">Experience Memory</text>
  <text x="208" y="158" text-anchor="middle" font-size="7.5" fill="#777" font-style="italic">log_edits.json</text>

  <!-- ==================== REVIEW STAGE ==================== -->
  <rect x="310" y="20" width="250" height="212" rx="6" fill="#e4e9f2" stroke="#8899bb" stroke-width="1.2"/>
  <text x="435" y="38" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a4a6a" letter-spacing="0.5">Review</text>

  <!-- Reviewer R₁ -->
  <rect x="322" y="56" width="86" height="32" rx="3" fill="#fff" stroke="#7788aa" stroke-width="0.8"/>
  <use href="#ic-search" x="327" y="66" width="11" height="11" style="color:#7788aa"/>
  <text x="343" y="77" font-size="9.5" fill="#3a4a6a">Reviewer R&#x2081;</text>

  <!-- Reviewer R₂ -->
  <rect x="322" y="96" width="86" height="32" rx="3" fill="#fff" stroke="#7788aa" stroke-width="0.8"/>
  <use href="#ic-search" x="327" y="106" width="11" height="11" style="color:#7788aa"/>
  <text x="343" y="117" font-size="9.5" fill="#3a4a6a">Reviewer R&#x2082;</text>

  <!-- Reviewer R₃ -->
  <rect x="322" y="136" width="86" height="32" rx="3" fill="#fff" stroke="#7788aa" stroke-width="0.8"/>
  <use href="#ic-search" x="327" y="146" width="11" height="11" style="color:#7788aa"/>
  <text x="343" y="157" font-size="9.5" fill="#3a4a6a">Reviewer R&#x2083;</text>

  <!-- Review Judge -->
  <rect x="462" y="80" width="90" height="64" rx="4" fill="#eaedf5" stroke="#556688" stroke-width="1.2"/>
  <use href="#ic-scale" x="501" y="87" width="12" height="12" style="color:#556688"/>
  <text x="507" y="114" text-anchor="middle" font-size="10" font-weight="bold" fill="#3a4a6a">Review Judge</text>
  <text x="507" y="128" text-anchor="middle" font-size="8" fill="#777">cross-examines</text>

  <!-- follow ups: interactions across the panel -->
  <line x1="408" y1="72" x2="460" y2="92" stroke="#5566aa" stroke-width="0.9" marker-end="url(#arrow-blue)"/>
  <text x="435" y="115" text-anchor="middle" font-size="7" fill="#5566aa" font-style="italic">follow ups</text>
  <line x1="462" y1="132" x2="410" y2="152" stroke="#5566aa" stroke-width="0.9" marker-end="url(#arrow-blue)"/>

  <!-- Frozen Batch to Reviewers (Distribution Bus at x=284) -->
  <line x1="256" y1="68" x2="284" y2="68" stroke="#333" stroke-width="1.1"/>
  <path d="M 284 68 L 284 72 L 320 72" fill="none" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M 284 68 L 284 112 L 320 112" fill="none" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M 284 68 L 284 152 L 320 152" fill="none" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- report.html -->
  <rect x="352" y="184" width="118" height="32" rx="4" fill="#fff" stroke="#5566aa" stroke-width="1.2"/>
  <use href="#ic-file-text" x="360" y="194" width="12" height="12" style="color:#5566aa"/>
  <text x="378" y="204" font-size="10" font-weight="bold" fill="#3a4a6a" font-style="italic">report.html</text>

  <!-- Judge to report.html -->
  <path d="M 507 144 L 507 170 L 411 170 L 411 182" fill="none" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ==================== PROPOSE STAGE ==================== -->
  <rect x="310" y="244" width="250" height="215" rx="6" fill="#e1ede7" stroke="#66997a" stroke-width="1.2"/>
  <text x="435" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a3a" letter-spacing="0.5">Propose</text>

  <!-- Proposer P₁ -->
  <rect x="322" y="284" width="86" height="32" rx="3" fill="#fff" stroke="#66997a" stroke-width="0.8"/>
  <use href="#ic-pencil" x="327" y="294" width="11" height="11" style="color:#66997a"/>
  <text x="343" y="304" font-size="9.5" fill="#2a5a3a">Proposer P&#x2081;</text>

  <!-- Proposer P₂ -->
  <rect x="322" y="324" width="86" height="32" rx="3" fill="#fff" stroke="#66997a" stroke-width="0.8"/>
  <use href="#ic-pencil" x="327" y="334" width="11" height="11" style="color:#66997a"/>
  <text x="343" y="344" font-size="9.5" fill="#2a5a3a">Proposer P&#x2082;</text>

  <!-- Proposer P₃ -->
  <rect x="322" y="364" width="86" height="32" rx="3" fill="#fff" stroke="#66997a" stroke-width="0.8"/>
  <use href="#ic-pencil" x="327" y="374" width="11" height="11" style="color:#66997a"/>
  <text x="343" y="384" font-size="9.5" fill="#2a5a3a">Proposer P&#x2083;</text>

  <!-- Propose Judge -->
  <rect x="462" y="308" width="90" height="64" rx="4" fill="#e4ede8" stroke="#3a7a5a" stroke-width="1.2"/>
  <use href="#ic-scale" x="501" y="315" width="12" height="12" style="color:#3a7a5a"/>
  <text x="507" y="342" text-anchor="middle" font-size="10" font-weight="bold" fill="#2a5a3a">Propose Judge</text>
  <text x="507" y="356" text-anchor="middle" font-size="8" fill="#777">cross-examines</text>

  <!-- follow ups: Propose interactions across the panel -->
  <line x1="408" y1="300" x2="460" y2="320" stroke="#3a7a5a" stroke-width="0.9" marker-end="url(#arrow-green)"/>
  <text x="435" y="343" text-anchor="middle" font-size="7" fill="#3a7a5a" font-style="italic">follow ups</text>
  <line x1="462" y1="360" x2="410" y2="380" stroke="#3a7a5a" stroke-width="0.9" marker-end="url(#arrow-green)"/>

  <!-- report.html distribution (Solid Bus at x=294) -->
  <path d="M 411 216 L 411 230 L 294 230 L 294 380" fill="none" stroke="#333" stroke-width="1.1"/>
  <line x1="294" y1="300" x2="320" y2="300" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="294" y1="340" x2="320" y2="340" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="294" y1="380" x2="320" y2="380" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Experience Memory distribution (Dashed Bus at x=278) -->
  <path d="M 256 143 L 278 143 L 278 380" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="278" y1="300" x2="320" y2="300" stroke="#888" stroke-width="0.8" marker-end="url(#arrow-gray)"/>
  <line x1="278" y1="340" x2="320" y2="340" stroke="#888" stroke-width="0.8" marker-end="url(#arrow-gray)"/>
  <line x1="278" y1="380" x2="320" y2="380" stroke="#888" stroke-width="0.8" marker-end="url(#arrow-gray)"/>

  <!-- proposal.json -->
  <rect x="352" y="405" width="118" height="38" rx="4" fill="#fff" stroke="#3a7a5a" stroke-width="1.2"/>
  <use href="#ic-file-text" x="360" y="414" width="12" height="12" style="color:#3a7a5a"/>
  <text x="378" y="423" font-size="9.5" font-weight="bold" fill="#2a5a3a" font-style="italic">proposal.json</text>
  <text x="411" y="436" text-anchor="middle" font-size="8" fill="#777">edits + commit msg</text>

  <!-- Judge to proposal.json -->
  <path d="M 507 372 L 507 390 L 411 390 L 411 403" fill="none" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ==================== VERIFICATION & COMMIT ==================== -->

  <!-- Verifier -->
  <rect x="596" y="314" width="116" height="52" rx="4" fill="#f5f0ea" stroke="#8a7a55" stroke-width="1.2"/>
  <use href="#ic-shield" x="648" y="321" width="12" height="12" style="color:#8a7a55"/>
  <text x="654" y="344" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#5a4a2a">Verifier</text>
  <text x="654" y="357" text-anchor="middle" font-size="8" fill="#777">anchor + evidence</text>

  <!-- proposal.json to Verifier -->
  <path d="M 470 424 L 580 424 L 580 340 L 594 340" fill="none" stroke="#333" stroke-width="1.1" marker-end="url(#arrow)"/>

  <!-- Rejection loop -->
  <path d="M 654 366 L 654 482 L 435 482 L 435 461" fill="none" stroke="#b05050" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow-reject)"/>
  <text x="544" y="495" text-anchor="middle" font-size="8" fill="#b05050" font-style="italic">rejection</text>

  <!-- Published AGENTS.md (Server) -->
  <rect x="596" y="170" width="116" height="52" rx="4" fill="#f5f5f5" stroke="#555" stroke-width="1.2"/>
  <use href="#ic-git" x="648" y="177" width="12" height="12" style="color:#555"/>
  <text x="654" y="200" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">Published AGENTS.md</text>
  <text x="654" y="213" text-anchor="middle" font-size="8" fill="#777" font-style="italic">served at /agents.md</text>

  <!-- Verifier to Published AGENTS.md (accept: apply, commit, publish) -->
  <line x1="654" y1="314" x2="654" y2="224" stroke="#333" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="664" y="259" font-size="8" font-weight="bold" fill="#4a8a4a" font-style="italic">accept:</text>
  <text x="664" y="271" font-size="7.5" fill="#555">apply edits</text>
  <text x="664" y="282" font-size="7.5" fill="#555">&amp; git commit</text>

  <!-- ==================== FEEDBACK / FETCH LOOP (DASHED) ==================== -->
  <path d="M 654 170 L 654 10 L 10 10 L 10 145 L 18 145" fill="none" stroke="#888" stroke-width="0.9" stroke-dasharray="4,2.5" marker-end="url(#arrow-gray)"/>
  <path d="M 10 145 L 10 178 L 208 178 L 208 168" fill="none" stroke="#888" stroke-width="0.9" stroke-dasharray="4,2.5" marker-end="url(#arrow-gray)"/>
  <text x="330" y="7" text-anchor="middle" font-size="7.5" fill="#666" font-style="italic">fetch latest /agents.md • experience update</text>
</svg>
