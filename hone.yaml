version: 1

service:
  data_dir: data
  token: ${HONE_TOKEN:-dev-token}
  host: 127.0.0.1
  port: 8080
  announce_host: host.docker.internal
  ui_dir: apps/web/dist
  expose_write_token: true

target:
  model: openai/gpt-5.4-mini

optimization:
  max_attempts: 3
  stage_timeout_s: 3600

majics:
  providers:
    openai:
      name: Hone gateway
      base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      api: openai-completions
      api_key_env: OPENAI_API_KEY

  models:
    gpt-5.4-mini:
      provider: openai
      id: gpt-5.4-mini
      name: GPT-5.4 mini
      reasoning: true
      input: [text]
      context_window: 272000
      max_tokens: 128000

    glm-5.2:
      provider: openai
      id: glm-5.2
      name: GLM 5.2
      reasoning: true
      input: [text]
      context_window: 272000
      max_tokens: 128000

    mimo-v2.5-pro:
      provider: openai
      id: skills/xiaomi/mimo-v2.5-pro
      name: MiMo V2.5 Pro
      reasoning: true
      input: [text]
      context_window: 272000
      max_tokens: 128000

    deepseek-v4-flash:
      provider: openai
      id: skills/deepseek/deepseek-v4-flash
      name: DeepSeek V4 Flash
      reasoning: true
      input: [text]
      context_window: 272000
      max_tokens: 128000

    minimax-m3:
      provider: openai
      id: skills/minimax/minimax-m3
      name: MiniMax M3
      reasoning: true
      input: [text]
      context_window: 272000
      max_tokens: 128000

  review:
    panel:
      - model: mimo-v2.5-pro
        reasoning: high
      - model: deepseek-v4-flash
        reasoning: high
      - model: minimax-m3
        reasoning: high
    judge:
      model: gpt-5.4-mini
      reasoning: high

  propose:
    panel:
      - model: deepseek-v4-flash
        reasoning: high
      - model: minimax-m3
        reasoning: high
      - model: mimo-v2.5-pro
        reasoning: high
    judge:
      model: gpt-5.4-mini
      reasoning: high
