<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hone booth loop</title>
<style>
  :root { --bg: #000; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; cursor: none; }
  video { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; background: var(--bg); }
</style>
</head>
<body>
<!-- Plays hone-loop.mp4 from this folder, muted and looping, with no controls. -->
<video id="loop" src="hone-loop.mp4" autoplay muted loop playsinline preload="auto" disablepictureinpicture></video>
<script>
const video = document.getElementById('loop');
video.muted = true;
const play = () => video.play().catch(() => {});
// Some players drop the loop after a decode stall or a sleep, so any pause or stall restarts playback.
video.addEventListener('pause', () => setTimeout(play, 500));
video.addEventListener('stalled', play);
video.addEventListener('ended', () => { video.currentTime = 0; play(); });
video.addEventListener('error', () => setTimeout(() => { video.load(); play(); }, 2000));
document.addEventListener('visibilitychange', () => { if (!document.hidden) play(); });
// Browsers allow full screen only after a click or a key press, so the first one asks for it.
const fullscreen = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); };
document.addEventListener('click', fullscreen);
document.addEventListener('keydown', fullscreen);
play();
</script>
</body>
</html>
