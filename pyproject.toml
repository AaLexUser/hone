[project]
name = "hone"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116",
    "harbor>=0.21.0",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "uvicorn>=0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/hone"]
